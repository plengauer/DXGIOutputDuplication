
name: OpenTelemetry
on:
  workflow_run:
    workflows:
      - .github/workflows/copilot-setup-steps.yml
      - Autobackport
      - Autoversion
      - Claude
      - CodeQL
      - Copilot
      - Copilot cloud agent
      - Copilot code review
      - OpenAI Codex
      - Recompile Agentic Workflows
      - Renovate
    types:
      - completed
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: plengauer/opentelemetry-github/actions/instrument/workflow@a3202770e6f9c17a81f2a7fd1073352b814d99b1 # v5.63.1
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
    permissions:
      actions: read
